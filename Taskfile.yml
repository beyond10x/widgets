version: '3'

# The workspace. Each directory under `widgets/` is one application and owns its own build — see
# `widgets/phone/Taskfile.yml`. This file only fans out across them, so adding a widget adds no
# lines here.

vars:
  APPS:
    sh: ls -d widgets/*/ 2>/dev/null | sed 's|/$||'

tasks:
  default:
    cmds: [{ task: check }]

  check:
    desc: The fast gate for every application — specification, scenarios, committed documentation.
    cmds:
      - for: { var: APPS }
        cmd: task -d {{.ITEM}} check

  build:
    desc: Everything, for every application. Run this before pushing.
    cmds:
      - for: { var: APPS }
        cmd: task -d {{.ITEM}} build

  clean:
    cmds:
      - for: { var: APPS }
        cmd: task -d {{.ITEM}} clean
