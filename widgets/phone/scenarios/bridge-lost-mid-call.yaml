# The connection dies under a live call. Two facts, and the model keeps them apart: the bridge is
# gone (`Transport`), and the call is over (`Media`). Neither implies the other by itself — a bridge
# can fail before any call exists, and a call can end with the bridge still up — so the kernel
# reports both.
#
# `end-session-with-failed-bridge` is what takes the neutral session down, which is the only reason
# a page that lost its connection does not leave a `Live` session behind.
type: ess-scenario/1
domain: softphone.bridge
scenario: bridge-lost-mid-call
summary: A live call loses its bridge; the session is terminated and the call fails on media.

arrange:
  - instance: phone
    entity: softphone.control.PhoneEndpoint
  - instance: session
    entity: softphone.media.MediaSession
  - instance: bridge
    entity: softphone.bridge.BridgeSession
  - instance: call
    entity: softphone.control.Call

timeline:
  - at: 2026-09-05T10:00:00Z
    command: softphone.control.ConfigureEndpoint
    actor: softphone.control.Human
    input:
      label: Devcenter
      default_binding: Bridge
    outcome: configured
    capture: {instance: phone, event: softphone.control.EndpointConfigured, field: endpoint_id}

  - at: 2026-09-05T10:00:01Z
    command: softphone.media.OpenSession
    actor: softphone.media.SessionHost
    input:
      session_ref: 'bridge-91b0'
      binding: Bridge
      profile:
        sample_format: PcmS16Le
        sample_rate_hz: 8000
        channels: 1
        packet_time_ms: 20
        frame_bytes: 320
      participant:
        reference: 'sip:1001@asterisk.dev.test'
        trust: Untrusted
    outcome: opened
    capture: {instance: session, event: softphone.media.SessionOpened, field: session_id}

  - at: 2026-09-05T10:00:02Z
    command: softphone.bridge.ConnectBridge
    actor: softphone.bridge.BridgeHost
    input:
      session_id: {$instance: session}
      endpoint: 'wss://phone.dev.test/phone'
      offer: 'v=0 o=- 0 0 IN IP4 0.0.0.0'
    outcome: connecting
    capture: {instance: bridge, event: softphone.bridge.BridgeConnecting, field: bridge_id}

  - at: 2026-09-05T10:00:03Z
    command: softphone.bridge.ConfirmBridge
    actor: softphone.bridge.Kernel
    input:
      bridge_id: {$instance: bridge}
      session_id: {$instance: session}
      answer: 'v=0 o=- 0 0 IN IP4 203.0.113.7'
    outcome: confirmed

  - at: 2026-09-05T10:00:04Z
    command: softphone.control.Dial
    actor: softphone.control.Human
    input:
      endpoint_id: {$instance: phone}
      remote: 'sip:1001@asterisk.dev.test'
    outcome: dialled
    capture: {instance: call, event: softphone.control.CallDialled, field: call_id}

  - at: 2026-09-05T10:00:06Z
    command: softphone.control.ConfirmAnswer
    actor: softphone.control.Kernel
    input:
      call_id: {$instance: call}
    outcome: confirmed

  - at: 2026-09-05T10:00:07Z
    command: softphone.control.AttachMedia
    actor: softphone.control.Kernel
    input:
      call_id: {$instance: call}
      session_id: {$instance: session}
    outcome: attached

  - at: 2026-09-05T10:00:08Z
    command: softphone.control.MediaConnected
    actor: softphone.control.Kernel
    input:
      call_id: {$instance: call}
    outcome: established

  # The connection went. `Transport` is what happened to the bridge; `TransportLost` is what the
  # media layer is told, and it is the neutral word the call log will carry.
  - at: 2026-09-05T10:00:26Z
    command: softphone.bridge.FailBridge
    actor: softphone.bridge.Kernel
    input:
      bridge_id: {$instance: bridge}
      session_id: {$instance: session}
      cause: Transport
      reason: TransportLost
    outcome: failed
    events:
      - event: softphone.bridge.BridgeFailed
        payload:
          cause: Transport
          reason: TransportLost

  # And the call, separately. `Media` rather than `Local`: nobody hung up, the audio path went.
  - at: 2026-09-05T10:00:27Z
    command: softphone.control.FailCall
    actor: softphone.control.Kernel
    input:
      call_id: {$instance: call}
      cause: Media
    outcome: failed
    events:
      - event: softphone.control.CallFailed
        payload:
          cause: Media
