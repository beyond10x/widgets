# The harm `refusals-on-a-closed-bridge.yaml` says the refusal exists to prevent, stated as a claim.
#
# Its header argues that a late answer "must not move a closed bridge to `Live`, because the
# entity's own invariant — `Live` implies `remote_sdp` — would then hold of a bridge nobody is
# connected to". `a-refusal-leaves-the-bridge-where-it-was.yaml` then checks the state and only the
# state, so the second half of that sentence is unchecked: a refusal that put the bridge back
# `Closed` and wrote the answer into it on the way past answers identically, leaves one row, leaves
# it `Closed`, and has published nothing.
#
# `remote_sdp` is optional and the row omits it when it is absent, so the claim has to be written as
# an exclusion rather than as `remote_sdp: null` — a `contains:` on a field the row does not project
# can never match. `excludes:` says the same thing about the value that would have been written.
type: ess-scenario/1
domain: softphone.bridge
scenario: adversary-a-refused-confirm-does-not-write-the-answer
summary: A refused ConfirmBridge does not record the answer it refused.

arrange:
  - instance: session
    entity: softphone.media.MediaSession
  - instance: bridge
    entity: softphone.bridge.BridgeSession

timeline:
  - at: 2026-09-07T12:00:00Z
    command: softphone.media.OpenSession
    actor: softphone.media.SessionHost
    input:
      session_ref: 'bridge-ad04'
      binding: Bridge
      profile:
        sample_format: PcmS16Le
        sample_rate_hz: 8000
        channels: 1
        packet_time_ms: 20
        frame_bytes: 320
      participant:
        reference: 'sip:2004@asterisk.dev.test'
        trust: Untrusted
    outcome: opened
    capture: {instance: session, event: softphone.media.SessionOpened, field: session_id}

  - at: 2026-09-07T12:00:01Z
    command: softphone.bridge.ConnectBridge
    actor: softphone.bridge.BridgeHost
    input:
      session_id: {$instance: session}
      endpoint: 'wss://phone.dev.test/phone'
      offer: 'v=0 o=- 0 0 IN IP4 0.0.0.0'
    outcome: connecting
    capture: {instance: bridge, event: softphone.bridge.BridgeConnecting, field: bridge_id}

  - at: 2026-09-07T12:00:02Z
    command: softphone.bridge.CloseBridge
    actor: softphone.bridge.BridgeHost
    input:
      bridge_id: {$instance: bridge}
      session_id: {$instance: session}
      cause: Local
      reason: Cancelled
    outcome: closed
    events:
      - event: softphone.bridge.BridgeClosed
        payload: { cause: Local, reason: Cancelled }

  - at: 2026-09-07T12:00:03Z
    command: softphone.bridge.ConfirmBridge
    actor: softphone.bridge.Kernel
    input:
      bridge_id: {$instance: bridge}
      session_id: {$instance: session}
      answer: 'v=0 o=- 0 0 IN IP4 198.51.100.9'
    outcome: wrong-state
    error:
      name: softphone.bridge.BridgeStateConflict
      fields: { state: Closed }
    no_events: [softphone.bridge.BridgeConfirmed]

assert:
  - view: softphone.bridge.BridgeById
    params: {bridge_id: {$instance: bridge}}
    counts: {at_least: 1, at_most: 1}
  - view: softphone.bridge.BridgeById
    params: {bridge_id: {$instance: bridge}}
    contains: {state: Closed, local_sdp: 'v=0 o=- 0 0 IN IP4 0.0.0.0'}
  - view: softphone.bridge.BridgeById
    params: {bridge_id: {$instance: bridge}}
    excludes: {remote_sdp: 'v=0 o=- 0 0 IN IP4 198.51.100.9'}
