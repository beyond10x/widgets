# The hand-written half of this application: the behaviour behind every obligation, the module
# the page loads, and the one service that holds a SIP stack. The generated half is under
# `.build/`, which is regenerated by `task synthesize` and never committed — hence `exclude`,
# since those trees carry workspaces of their own.
#
# Two of the three members build for `wasm32-unknown-unknown` and one does not: `phone-server` is
# a native process. `task impl` therefore names `-p softphone-shell` rather than building the
# whole workspace for wasm. `exclude` was the alternative and is wrong here — an excluded crate is
# not in the workspace at all, so `cargo test -p phone-server` from this directory would not
# resolve it.
[workspace]
resolver = "2"
members = [
  "crates/phone-server",
  "crates/softphone-behaviour",
  "crates/softphone-shell",
]
exclude = [".build"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
softphone-types = { path = ".build/rust/softphone/crates/softphone-types" }
softphone-system = { path = ".build/rust/softphone/crates/softphone-system" }
bridge-binding = { path = ".build/rust/softphone/crates/bridge-binding" }
call-history = { path = ".build/rust/softphone/crates/call-history" }
local-binding = { path = ".build/rust/softphone/crates/local-binding" }
media-session = { path = ".build/rust/softphone/crates/media-session" }
phone-console = { path = ".build/rust/softphone/crates/phone-console" }
phone-control = { path = ".build/rust/softphone/crates/phone-control" }
phone-directory = { path = ".build/rust/softphone/crates/phone-directory" }
phone-presence = { path = ".build/rust/softphone/crates/phone-presence" }
sip-binding = { path = ".build/rust/softphone/crates/sip-binding" }
softphone-behaviour = { path = "crates/softphone-behaviour" }

# sipx, which is the whole telephony stack `phone-server` stands on.
#
# Pinned exactly at `=1.0.1`, the highest version published to crates.io. The workspace at
# `/home/timo/projects/sipx` reads `version = "1.1.0"`, but that is unreleased: asking cargo for
# `=1.1.0` is refused with "candidate versions found which didn't match: 1.0.1, 1.0.0-rc.23, …".
# So there is nothing here to pin by git rev — 1.0.1 already carries every entry point this
# service needs, and a registry pin is reproducible for anyone who checks the repository out.
#
# `dtls` on `sipx-media` is not optional for us: the browser leg is DTLS-SRTP, and
# `MediaPort::start_browser_audio` is `#[cfg(feature = "dtls")]`.
#
# `opus` is enabled to **name** the codec, not to run it. A browser's offer puts Opus first and
# `browser_audio::answer` preserves the offered order, so that is the pair this server is asked for
# — and `sipx_media::Bridge` moves buffers between legs without converting the sample rate, so
# `browser::bridgeable` refuses it. Refusing it precisely still needs the variant to exist:
# `Codec::Opus` is absent without the feature, and `Accepted::codec` would then decline the offer
# as an incomplete codec set instead of saying which codec at which rate and what to offer instead.
# (This comment said the pair "transcodes" until correction round 1 measured what that does.)
# Back at `=1.0.1`, the highest version published to crates.io, after measuring the alternative.
#
# The unreleased 1.1.0 tree was tried on 2026-09-05 because three merges had landed on
# `crates/sipx-media/src/browser.rs` and `session.rs` since this tag — M-134, M-135, M-137,
# including "Require ICE consent freshness before media" — and that is the code a browser leg's
# bring-up runs. It changed nothing that matters here: the bring-up still never returns when a
# browser's ICE fails, because `browser::prepare` awaits its supervisor task with no timeout of its
# own. `browser::BRING_UP` in this crate is the bound, and it works against either version.
sipx-call = "=1.0.1"
sipx-media = { version = "=1.0.1", features = ["dtls", "opus"] }
sipx-sdp = "=1.0.1"
sipx-sip = "=1.0.1"
# `sipx-transport` is what makes `cargo test -p phone-server` hermetic: the tests bind two
# ordinary loopback endpoints and drive this crate's leg against `sipx_call::answer` on the other
# one, so no test needs the network, a second machine, or the `sipx` binary — which on this machine
# is `0.8.0` and would not be the code under test. `sipx-testkit` is the published alternative and
# is not used: its `CallHarness` drives `sipx_call::dial` itself, so it tests sipx rather than this.
sipx-transport = "=1.0.1"

# Everything else `phone-server` needs, and nothing from any other organisation's packages.
# `bytes` is here because `sipx_sip::Uri::parse` takes a `Bytes` and sipx re-exports none: a URI
# is parsed from the destination the page sent, so the type is unavoidable rather than chosen.
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# RFC 8839 §5.4 wants fresh ICE credentials per generation, and sipx publishes no helper that
# draws them.
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# No TLS features. The control channel is `ws://` on a loopback or an internal address and a
# reverse proxy terminates `wss://`; a second certificate policy inside this process would be one
# nobody configures and nobody checks.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
