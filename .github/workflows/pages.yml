# Publishes `pages/` as it is committed. Nothing is built here on purpose: the tree is generated by
# `task pages` on a machine that has the `ess` CLI, and `task pages-drift` refuses a commit whose
# `pages/` is not what the specification determines. Building it in CI would mean installing the
# toolchain on every push to publish bytes a gate has already checked.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
